<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <rect width="200" height="160" fill="#f8f8f6"/>
  <!-- Tongue label close-up -->
  <!-- Label background (white tag) -->
  <rect x="52" y="30" width="96" height="90" rx="4" fill="white" stroke="#ddd" stroke-width="1.5"/>
  <!-- Brand logo bar -->
  <rect x="60" y="38" width="80" height="16" rx="2" fill="#111"/>
  <text x="100" y="50" text-anchor="middle" font-family="system-ui,sans-serif" font-size="9" font-weight="900" fill="white" letter-spacing="3">BRAND</text>
  <!-- Model name -->
  <text x="100" y="70" text-anchor="middle" font-family="system-ui,sans-serif" font-size="8" font-weight="600" fill="#333">MODEL NAME</text>
  <!-- Size line -->
  <text x="100" y="84" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#666">US 10  UK 9  EUR 44  CM 28</text>
  <!-- Country -->
  <text x="100" y="96" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#666">MADE IN CHINA</text>
  <!-- Material line -->
  <text x="100" y="107" text-anchor="middle" font-family="system-ui,sans-serif" font-size="6" fill="#aaa">UPPER: LEATHER · SOLE: RUBBER</text>
  <!-- Stitching border hint -->
  <rect x="56" y="34" width="88" height="82" rx="3" fill="none" stroke="#ccc" stroke-width="1" stroke-dasharray="3 2"/>
  <!-- Camera -->
  <rect x="82" y="10" width="36" height="22" rx="4" fill="#111" opacity="0.7"/>
  <circle cx="100" cy="21" r="6" fill="none" stroke="white" stroke-width="1.5"/>
  <circle cx="100" cy="21" r="2.5" fill="white" opacity="0.5"/>
  <!-- Label -->
  <text x="100" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#666">TONGUE LABEL · CLOSE-UP · LEGIBLE</text>
</svg>
