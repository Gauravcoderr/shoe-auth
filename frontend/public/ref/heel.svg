<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <rect width="200" height="160" fill="#f8f8f6"/>
  <!-- Heel back view -->
  <!-- Upper back panel -->
  <path d="M70 45 Q100 38 130 45 L128 95 Q100 100 72 95 Z" fill="#222"/>
  <!-- Ankle collar -->
  <path d="M72 95 Q100 100 128 95 Q128 98 125 102 Q100 108 75 102 Q72 98 72 95 Z" fill="#333"/>
  <!-- Collar opening (oval) -->
  <ellipse cx="100" cy="62" rx="22" ry="28" fill="#444" opacity="0.8"/>
  <!-- Heel counter seam (center) -->
  <line x1="100" y1="45" x2="100" y2="100" stroke="#666" stroke-width="1.5" stroke-dasharray="3 2"/>
  <!-- Heel pull tab -->
  <rect x="92" y="35" width="16" height="20" rx="3" fill="#555"/>
  <text x="100" y="48" text-anchor="middle" font-family="system-ui,sans-serif" font-size="7" fill="#999">LOGO</text>
  <!-- Midsole -->
  <path d="M72 102 Q100 108 128 102 L130 112 Q100 118 70 112 Z" fill="#e8e8e0"/>
  <!-- Outsole -->
  <path d="M70 112 Q100 118 130 112 L132 120 Q100 126 68 120 Z" fill="#555"/>
  <!-- Camera from behind -->
  <rect x="82" y="14" width="36" height="22" rx="4" fill="#111" opacity="0.7"/>
  <circle cx="100" cy="25" r="6" fill="none" stroke="white" stroke-width="1.5"/>
  <circle cx="100" cy="25" r="2.5" fill="white" opacity="0.5"/>
  <!-- Arrow -->
  <line x1="100" y1="40" x2="100" y2="55" stroke="#111" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <path d="M96 52 L100 58 L104 52" stroke="#111" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Label -->
  <text x="100" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#666">HEEL · DIRECTLY BEHIND</text>
</svg>
