<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <rect width="200" height="160" fill="#f8f8f6"/>
  <!-- Sole from below -->
  <ellipse cx="100" cy="88" rx="60" ry="36" fill="#444"/>
  <ellipse cx="52" cy="88" rx="14" ry="26" fill="#444"/>
  <ellipse cx="152" cy="88" rx="10" ry="20" fill="#555"/>
  <!-- Tread lines (herringbone pattern) -->
  <line x1="60" y1="76" x2="145" y2="76" stroke="#666" stroke-width="1.5"/>
  <line x1="58" y1="84" x2="143" y2="84" stroke="#666" stroke-width="1.5"/>
  <line x1="58" y1="92" x2="143" y2="92" stroke="#666" stroke-width="1.5"/>
  <line x1="60" y1="100" x2="145" y2="100" stroke="#666" stroke-width="1.5"/>
  <!-- Pivot circle (AF1 reference) -->
  <circle cx="72" cy="88" r="10" stroke="#888" stroke-width="1.5" fill="none"/>
  <!-- Branding text area -->
  <rect x="90" y="84" width="40" height="8" rx="2" fill="#555"/>
  <!-- Camera from below -->
  <rect x="82" y="14" width="36" height="22" rx="4" fill="#111" opacity="0.7"/>
  <circle cx="100" cy="25" r="6" fill="none" stroke="white" stroke-width="1.5"/>
  <circle cx="100" cy="25" r="2.5" fill="white" opacity="0.5"/>
  <!-- Arrow -->
  <line x1="100" y1="40" x2="100" y2="58" stroke="#111" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5"/>
  <path d="M96 55 L100 62 L104 55" stroke="#111" stroke-width="1.5" fill="none" opacity="0.5"/>
  <!-- Label -->
  <text x="100" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#666">SOLE · CAMERA DIRECTLY ABOVE</text>
</svg>
