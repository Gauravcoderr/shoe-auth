<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" fill="none">
  <rect width="200" height="160" fill="#f8f8f6"/>
  <!-- Top-down shoe shape -->
  <ellipse cx="100" cy="90" rx="62" ry="38" fill="#222"/>
  <!-- Toe box rounded front -->
  <ellipse cx="48" cy="90" rx="16" ry="28" fill="#222"/>
  <!-- Heel rounded back -->
  <ellipse cx="156" cy="90" rx="12" ry="22" fill="#333"/>
  <!-- Tongue area -->
  <rect x="70" y="74" width="50" height="32" rx="6" fill="#444"/>
  <!-- Lace eyelets -->
  <circle cx="80" cy="82" r="2" fill="#888"/>
  <circle cx="80" cy="90" r="2" fill="#888"/>
  <circle cx="80" cy="98" r="2" fill="#888"/>
  <circle cx="120" cy="82" r="2" fill="#888"/>
  <circle cx="120" cy="90" r="2" fill="#888"/>
  <circle cx="120" cy="98" r="2" fill="#888"/>
  <!-- Laces -->
  <line x1="80" y1="82" x2="120" y2="82" stroke="#ccc" stroke-width="1.5"/>
  <line x1="80" y1="90" x2="120" y2="90" stroke="#ccc" stroke-width="1.5"/>
  <line x1="80" y1="98" x2="120" y2="98" stroke="#ccc" stroke-width="1.5"/>
  <!-- Camera icon from above -->
  <rect x="82" y="14" width="36" height="26" rx="5" fill="#111" opacity="0.7"/>
  <circle cx="100" cy="27" r="7" fill="none" stroke="white" stroke-width="2"/>
  <circle cx="100" cy="27" r="3" fill="white" opacity="0.5"/>
  <!-- Down arrow -->
  <line x1="100" y1="44" x2="100" y2="60" stroke="#111" stroke-width="2" stroke-dasharray="4 3" opacity="0.5"/>
  <path d="M95 57 L100 64 L105 57" stroke="#111" stroke-width="2" fill="none" opacity="0.5"/>
  <!-- Label -->
  <text x="100" y="148" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" font-weight="600" fill="#666">TOP DOWN · DIRECTLY ABOVE</text>
</svg>
